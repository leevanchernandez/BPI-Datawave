AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: BPI Datawave case agent backend. SYNTHETIC DATA ONLY until BPI compliance review. NOT YET DEPLOYED OR VALIDATED.

# Region note: there is no Philippine region for Textract or Bedrock. Singapore (ap-southeast-1) has Textract;
# Claude Haiku 5.5 reaches Singapore only through global cross-region inference (data may be processed elsewhere).
# Sydney (ap-southeast-2) has an AU geo profile for Haiku 5.5. Pick one deliberately, see docs/aws.md.

Parameters:
  BedrockModelId:
    Type: String
    Default: anthropic.claude-haiku-5-5
    # UNVERIFIED: this default id and its availability. In ap-southeast-1, Haiku 5.5 is reported to be reachable only
    # through a global cross-region inference profile, so pass that profile's id here (copy it from the Bedrock console,
    # do not guess it). Sonnet 5 is reported to be available in-region. IAM below is scoped to this value.
    Description: Bedrock model id or inference profile id for Claude. Copy the exact id from the Bedrock console.
  DemoKey:
    Type: String
    NoEcho: true
    MinLength: 24
    AllowedPattern: '^[A-Za-z0-9_-]+$'
    Description: Shared demo secret, sent by callers as the x-demo-key header. Demo only. It is visible to anyone who can read the Lambda configuration.
  ReviewOrigin:
    Type: String
    Default: http://localhost:8000
    Description: Browser origin allowed by CORS (the frontend).

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 60
    MemorySize: 512
    Environment:
      Variables:
        EVENTS_TABLE: !Ref EventsTable
        UPLOAD_BUCKET: !Ref UploadBucket
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        DEMO_KEY: !Ref DemoKey

Resources:
  UploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: aws:kms }   # swap to a customer-managed key for production
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      LifecycleConfiguration:
        Rules:
          - { Id: expire-uploads, Status: Enabled, ExpirationInDays: 1 }
      CorsConfiguration:
        CorsRules:
          - { AllowedMethods: [POST], AllowedOrigins: [!Ref ReviewOrigin], AllowedHeaders: ['*'], MaxAge: 300 }   # presigned POST uploads

  UploadBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UploadBucket
      PolicyDocument:
        Statement:
          - Sid: TlsOnly
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt UploadBucket.Arn, !Sub '${UploadBucket.Arn}/*']
            Condition: { Bool: { 'aws:SecureTransport': 'false' } }

  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: referralId, AttributeType: S }, { AttributeName: at, AttributeType: S }]
      KeySchema: [{ AttributeName: referralId, KeyType: HASH }, { AttributeName: at, KeyType: RANGE }]
      SSESpecification: { SSEEnabled: true }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref ReviewOrigin]
        AllowMethods: [POST, OPTIONS]
        AllowHeaders: [content-type, x-demo-key]
      # Demo auth is a shared x-demo-key checked in the Lambda (backend/handler.cjs).
      # TODO before any real use: IAM or Cognito authorizer. A shared key in front of a bank workflow is not acceptable.

  CheckFunction:
    Type: AWS::Serverless::Function
    Metadata: { BuildMethod: esbuild, BuildProperties: { Minify: true, Target: es2022, Format: cjs, EntryPoints: [lambda.cjs], External: ['@aws-sdk/client-*', '@aws-sdk/lib-dynamodb'] } }   # s3-presigned-post is bundled
    Properties:
      CodeUri: ../backend/
      Handler: lambda.check
      Events:
        Check: { Type: HttpApi, Properties: { ApiId: !Ref Api, Method: POST, Path: /check } }
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:GetObject   # no ListBucket, so a missing key reads as AccessDenied rather than NoSuchKey
              Resource: !Sub '${UploadBucket.Arn}/uploads/*'
            - Effect: Allow
              Action: [dynamodb:Query, dynamodb:PutItem]
              Resource: !GetAtt EventsTable.Arn
            - Effect: Allow
              Action: [textract:DetectDocumentText, textract:AnalyzeDocument]
              Resource: '*'   # Textract has no resource-level permissions for these actions, so '*' is the only option
            # Bedrock, scoped to BedrockModelId. UNVERIFIED: which IAM action and resource the Mantle (Messages API) endpoint
            # checks, and the ARN form for a global profile (assumed to have an empty region, which bedrock:* matches).
            # If calls fail with AccessDenied after model access is enabled, use the commented '*' line, read the denied
            # ARN in CloudTrail, then narrow again.
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource:
                - !Sub 'arn:${AWS::Partition}:bedrock:*::foundation-model/${BedrockModelId}'                   # a plain model id
                - !Sub 'arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/${BedrockModelId}'  # a profile id
                - !Sub 'arn:${AWS::Partition}:bedrock:*::foundation-model/anthropic.claude-*'  # the model a profile routes to; narrow to the exact id once known
              # Resource: '*'

  AskFunction:
    Type: AWS::Serverless::Function
    Metadata: { BuildMethod: esbuild, BuildProperties: { Minify: true, Target: es2022, Format: cjs, EntryPoints: [lambda.cjs], External: ['@aws-sdk/client-*', '@aws-sdk/lib-dynamodb'] } }   # s3-presigned-post is bundled
    Properties:
      CodeUri: ../backend/
      Handler: lambda.ask
      Events:
        Ask: { Type: HttpApi, Properties: { ApiId: !Ref Api, Method: POST, Path: /ask } }
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref EventsTable }
        - Statement:
            # Bedrock, scoped to BedrockModelId. UNVERIFIED: which IAM action and resource the Mantle (Messages API) endpoint
            # checks, and the ARN form for a global profile (assumed to have an empty region, which bedrock:* matches).
            # If calls fail with AccessDenied after model access is enabled, use the commented '*' line, read the denied
            # ARN in CloudTrail, then narrow again.
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource:
                - !Sub 'arn:${AWS::Partition}:bedrock:*::foundation-model/${BedrockModelId}'                   # a plain model id
                - !Sub 'arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/${BedrockModelId}'  # a profile id
                - !Sub 'arn:${AWS::Partition}:bedrock:*::foundation-model/anthropic.claude-*'  # the model a profile routes to; narrow to the exact id once known
              # Resource: '*'

  UploadUrlFunction:
    Type: AWS::Serverless::Function
    Metadata: { BuildMethod: esbuild, BuildProperties: { Minify: true, Target: es2022, Format: cjs, EntryPoints: [lambda.cjs], External: ['@aws-sdk/client-*', '@aws-sdk/lib-dynamodb'] } }   # s3-presigned-post is bundled
    Properties:
      CodeUri: ../backend/
      Handler: lambda.uploadUrl
      Timeout: 10
      Events:
        UploadUrl: { Type: HttpApi, Properties: { ApiId: !Ref Api, Method: POST, Path: /upload-url } }
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:PutObject   # the presigned POST is signed with this role, so it can only write under uploads/
              Resource: !Sub '${UploadBucket.Arn}/uploads/*'

Outputs:
  ApiUrl: { Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com' }
  UploadBucketName: { Value: !Ref UploadBucket }
